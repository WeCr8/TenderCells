# TenderCells CT72 rev A1.2 - belt gantry (Cartesian, dual-motor X) on Klipper
# MCU: BTT SKR Mini E3 V3 (TMC2209 UART). X = X driver, X1 = E driver, Y = Y driver, Z = Z driver (Tr8x2 screw).
# Host: Pi Zero 2 W (Starter) / Pi 5 (Plus) / Jetson (Pro) + Moonraker (routine controller talks HTTP).
# Coordinates = CAD frame (mm): X = bridge centre gx, Y = carriage gy, Z = arm-plate underside pz.
# Travel from cad/ct72_params.py (A1.2): X 417-1711.8, Y 175-1653.8, Z 850-2133.6. Pin names: verify against the
# SKR Mini E3 V3 pinout before first power-up. NOTHING here has run on hardware yet.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_CT72-if00

[printer]
kinematics: cartesian
max_velocity: 150            # animal-safe cap (host caps routines at 150, insert moves 20 mm/s)
max_accel: 1000              # = gantry sizing assumption (GANTRY_SIZING.md)
max_z_velocity: 15           # Tr8x2 1.45 m screw: whip limit ~440 rpm (fixed-supported, 80%)
max_z_accel: 100
square_corner_velocity: 3

# ---------------- X (dual motor, each side homes to its own switch -> squares the bridge)
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40        # GT2 20T
endstop_pin: ^PC0            # X min FRONT
position_min: 417
position_endstop: 417
position_max: 1711.8
homing_speed: 25
second_homing_speed: 5

[stepper_x1]                 # E driver
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC15           # X min BACK (E0 endstop header)

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_min: 175
position_endstop: 175
position_max: 1653.8
homing_speed: 25

[stepper_z]                  # Tr8x2 lead screw, homes UP (away from birds)
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 2
endstop_pin: ^PC2            # Z MAX switch
position_min: 850
position_endstop: 2133.6
position_max: 2133.6
homing_positive_dir: true
homing_speed: 10

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 1.2
stealthchop_threshold: 0
diag_pin: ^PC0
driver_SGTHRS: 80            # StallGuard = collision DETECTION (not primary homing), tune on the machine

[tmc2209 stepper_x1]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 1.2
stealthchop_threshold: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.1
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.0
stealthchop_threshold: 0

# ---------------- E-stop: the hardware chain cuts 24 V motor power; this input also halts Klipper at once
[gcode_button estop_chain]
pin: ^!PC12
press_gcode:
  M112

[idle_timeout]
timeout: 600
gcode:
  M84

[gcode_macro CELL_HOME]
description: Z up first (away from birds), then dual-X squaring + Y
gcode:
  G28 Z
  G28 X Y
  G90

[gcode_macro CELL_PARK]
gcode:
  G90
  G1 Z1983.6 F900
  G1 X1711.8 Y1653.8 F6000
  G1 Z2133.6 F900
  M400

[save_variables]
filename: ~/printer_data/config/ct72_vars.cfg

# Moonraker exposes motion_report.live_position; the host stamps it (ct72/gantry.py) for the dataset.
