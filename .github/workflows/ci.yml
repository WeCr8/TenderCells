name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tendercells-ui:
    name: "UI — build, type-check, tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/tendercells_ui/test_output/tendercells-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: applications/tendercells_ui/test_output/tendercells-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Quality loop (build + tests)
        run: npm run quality:loop

  functions:
    name: "Cloud Functions — build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  firmware:
    name: "Firmware — PlatformIO build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/**/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Chicken Tender firmware
        run: cd firmware/chicken-tender && pio run

      - name: Build WatchTower firmware
        run: cd firmware/watchtower && pio run
        continue-on-error: true

      - name: Check binary size
        run: |
          SIZE=$(stat -c%s firmware/chicken-tender/.pio/build/esp32-wroom-32/firmware.bin 2>/dev/null || echo "0")
          echo "Firmware size: $SIZE bytes"
          if [ "$SIZE" -gt 3932160 ]; then
            echo "Warning: Firmware exceeds 3.75MB flash limit"
          fi

  arm-service:
    name: "Arm service — pytest (sim, UR, LeRobot, Hugging Face policies)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install pytest numpy opencv-python-headless
      - name: Run arm service tests
        run: python -m pytest -q firmware/jetson-nano/tests

  security:
    name: "Security — secret scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for Google API keys
        run: |
          if grep -rn 'AIza[0-9A-Za-z_-]\{35\}' . \
              --exclude-dir=node_modules --exclude-dir=.git --exclude='*.env' 2>/dev/null; then
            echo "ERROR: Hardcoded Google API key found"
            exit 1
          fi

      - name: Scan for Anthropic keys
        run: |
          if grep -rn 'ANTHROPIC_API_KEY\s*=\s*"sk-ant' . \
              --exclude-dir=node_modules --exclude='*.env' 2>/dev/null; then
            echo "ERROR: Hardcoded Anthropic API key found"
            exit 1
          fi

      - name: Scan for hardcoded WiFi passwords in firmware
        run: |
          if grep -rn 'password\s*=\s*"[a-zA-Z0-9_!@#]\{6,\}"' firmware/ --include='*.cpp' 2>/dev/null; then
            echo "ERROR: Hardcoded WiFi password in firmware"
            exit 1
          fi

  # Deploying lives in deploy.yml (runs after this workflow succeeds on main).
  # FIX(2026-09-27): a second deploy job here built the site WITHOUT the Firebase
  # web config and, finishing ~1 min after deploy.yml, overwrote every good
  # release - so tendercells.com kept showing "published without Firebase
  # configuration" although deploy.yml's checks passed.
