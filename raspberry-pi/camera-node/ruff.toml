# Lint config for the Pi camera node + timing tools (Pi OS Bullseye ships Python 3.9).
target-version = "py39"
line-length = 130

[lint]
select = ["E", "F", "W", "B", "I", "S"]
# S310/S104: LAN-only URLs and bind-all are the point of a camera node.
# B905: zip(strict=) needs Python 3.10.
ignore = ["S101", "S104", "S110", "S112", "S310", "S311", "S603", "S607", "B905"]
