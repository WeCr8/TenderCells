<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Step 7: Find the LED's long leg (+)">
