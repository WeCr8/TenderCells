; TenderCells CT72 cell-IO node (rev A1.2) - Seeed XIAO ESP32-S3
; Owns: camera hardware trigger (30 Hz) + edge timestamps, roost bar actuators + interlocks,
; nest-lid actuator, Starter vacuum tool, E-stop chain sense. Host link = USB-CDC, newline JSON.
[env:xiao_cell_io]
platform = espressif32 @ 6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 921600
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCT72_CELL_IO
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
  adafruit/Adafruit ADS1X15@^2.5.0
  bogde/HX711@^0.7.5
