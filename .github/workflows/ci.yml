name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Save build minutes: a newer push to the same PR / branch cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # PRs: a newer push replaces the old run. main: every push is tested (deploys follow CI).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts changed? Jobs below skip when their area is untouched (a skipped job
  # still satisfies required checks). Docs-only changes run just the secret scan.
  changes:
    name: "Changed areas"
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.f.outputs.ui }}
      api: ${{ steps.f.outputs.api }}
      functions: ${{ steps.f.outputs.functions }}
      firmware: ${{ steps.f.outputs.firmware }}
      python: ${{ steps.f.outputs.python }}
      rules: ${{ steps.f.outputs.rules }}
      website: ${{ steps.f.outputs.website }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; HEAD="$PR_HEAD"; else BASE="$PUSH_BEFORE"; HEAD="$GITHUB_SHA"; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base ($BASE) - running everything"
            for k in ui api functions firmware python rules website; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          FILES=$(git diff --name-only "$BASE" "$HEAD")
          echo "$FILES"
          has() { if echo "$FILES" | grep -qE "$1"; then echo true; else echo false; fi; }
          APPS='^applications/tendercells_ui/test_output'
          echo "ui=$(has "$APPS/(tendercells-ui|website|shared)/|^\.github/workflows/ci\.yml")" >> "$GITHUB_OUTPUT"
          echo "api=$(has "$APPS/express-api/|$APPS/website/public/api/|^\.github/workflows/ci\.yml")" >> "$GITHUB_OUTPUT"
          echo "functions=$(has '^functions/|^\.github/workflows/ci\.yml')" >> "$GITHUB_OUTPUT"
          echo "firmware=$(has '^firmware/(chicken-tender|watchtower|camera-node|shared|roaming-roost|starter-node)/|^\.github/workflows/ci\.yml')" >> "$GITHUB_OUTPUT"
          echo "python=$(has '^firmware/jetson-nano/|^\.github/workflows/ci\.yml')" >> "$GITHUB_OUTPUT"
          # Website: its own code, the OS routes it links into, and the docs its lessons / doc list come from.
          echo "website=$(has "$APPS/(website|shared)/|$APPS/tendercells-ui/src/routes/|^docs/|^\.github/workflows/ci\.yml")" >> "$GITHUB_OUTPUT"
          echo "rules=$(has '^firestore\.rules$|^firestore-tests/|^firebase\.json$|^vitest\.config\.ts$|^package(-lock)?\.json$|^\.github/workflows/ci\.yml')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  tendercells-ui:
    name: "UI — build, type-check, tests"
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/tendercells_ui/test_output/tendercells-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: applications/tendercells_ui/test_output/tendercells-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Quality loop (build + tests)
        run: npm run quality:loop

  website:
    name: "Website — type-check, docs in sync, link audit, build"
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/tendercells_ui/test_output/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: applications/tendercells_ui/test_output/website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lessons + docs pages match the repo (run npm run sync:docs to fix)
        run: npm run check:docs

      - name: Link audit (routes, anchors, OS links, repo docs)
        run: npm run check:links

      - name: Type-check + build
        run: npm run build

  express-api:
    name: "API — type-check + backend XML"
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/tendercells_ui/test_output/express-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: applications/tendercells_ui/test_output/express-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit -p .

      - name: Unit tests (mower bridge + interlocks)
        run: npm test

      - name: Backend XML is up to date (website/public/api/tendercells-backend.xml)
        run: npm run describe:xml -- --check

  functions:
    name: "Cloud Functions — build"
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  firmware:
    name: "Firmware — PlatformIO build"
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/**/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Chicken Tender firmware
        run: cd firmware/chicken-tender && pio run

      - name: Build WatchTower firmware
        run: cd firmware/watchtower && pio run
        continue-on-error: true

      - name: Check binary size
        run: |
          SIZE=$(stat -c%s firmware/chicken-tender/.pio/build/esp32-wroom-32/firmware.bin 2>/dev/null || echo "0")
          echo "Firmware size: $SIZE bytes"
          if [ "$SIZE" -gt 3932160 ]; then
            echo "Warning: Firmware exceeds 3.75MB flash limit"
          fi

  arm-service:
    name: "Arm service — pytest (sim, UR, LeRobot, Hugging Face policies)"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install pytest numpy opencv-python-headless
      - name: Run arm service tests
        run: python -m pytest -q firmware/jetson-nano/tests

  firestore-rules:
    name: "Firestore rules — emulator tests"
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Rules tests (tenant isolation, roles, school sharing, newsletter, inquiries)
        run: npm run test:rules

  security:
    name: "Security — secret scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for Google API keys
        run: |
          if grep -rn 'AIza[0-9A-Za-z_-]\{35\}' . \
              --exclude-dir=node_modules --exclude-dir=.git --exclude='*.env' 2>/dev/null; then
            echo "ERROR: Hardcoded Google API key found"
            exit 1
          fi

      - name: Scan for Anthropic keys
        run: |
          if grep -rn 'ANTHROPIC_API_KEY\s*=\s*"sk-ant' . \
              --exclude-dir=node_modules --exclude='*.env' 2>/dev/null; then
            echo "ERROR: Hardcoded Anthropic API key found"
            exit 1
          fi

      - name: Scan for hardcoded WiFi passwords in firmware
        run: |
          if grep -rn 'password\s*=\s*"[a-zA-Z0-9_!@#]\{6,\}"' firmware/ --include='*.cpp' 2>/dev/null; then
            echo "ERROR: Hardcoded WiFi password in firmware"
            exit 1
          fi

  # Deploying lives in deploy.yml (runs after this workflow succeeds on main).
  # FIX(2026-09-27): a second deploy job here built the site WITHOUT the Firebase
  # web config and, finishing ~1 min after deploy.yml, overwrote every good
  # release - so tendercells.com kept showing "published without Firebase
  # configuration" although deploy.yml's checks passed.
