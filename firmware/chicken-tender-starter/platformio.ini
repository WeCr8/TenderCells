; Chicken Tender Starter - XIAO ESP32-S3 + DRV8874 + 12 V cord-lift door actuator.
; Hardware: hardware/chicken-tender-starter (tc-hw/1). Two actuator tiers share this
; firmware; they differ only in travel timeout (the Starter generic actuator is ~4x slower).
[platformio]
default_envs = xiao_starter, xiao_pro

[env]
; Same pinned core as firmware/chicken-tender (Arduino-ESP32 2.0.x).
platform = espressif32 @ 6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0
  tzapu/WiFiManager@^2.0.17
  robtillaart/DHT20@^0.3.1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
; Our own sources (src/ and lib/door_logic) must compile with zero warnings.
build_src_flags =
  -Wall
  -Wextra
  -Werror
test_ignore = host

[env:xiao_starter]
; Starter tier: generic 12 V linear actuator (verify listing/force), assumed ~10 mm/s no-load,
; ~8 mm/s derated: 280 mm = 35 s; x1.5 + 2 s. Re-time if your actuator's listed speed differs.
build_flags =
  ${env.build_flags}
  -DCT_TIER_NAME=\"starter\"
  -DCT_TRAVEL_TIMEOUT_MS=55000

[env:xiao_pro]
; Pro tier: Glideforce LACT12-12V-05, 36.5 mm/s at max load (Pololu 2326): 280 mm = 7.7 s; x1.5 + 2 s.
build_flags =
  ${env.build_flags}
  -DCT_TIER_NAME=\"pro\"
  -DCT_TRAVEL_TIMEOUT_MS=14000
