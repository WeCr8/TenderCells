name: Deploy (Firebase Hosting)

# Builds the marketing site + the app (and the AI snapshot) and publishes to
# Firebase Hosting after the CI workflow passes on main. This is the ONLY
# workflow that deploys Hosting (ci.yml's duplicate deploy job was removed: it
# built without the Firebase config and overwrote this one's releases).
#
# Required repo secret:
#   FIREBASE_SERVICE_ACCOUNT_TENDER_CELLS — the service-account JSON (already set).
# Project id is read from that JSON's project_id.
# Optional repo variable:
#   FIREBASE_WEB_APP_ID — which Firebase web app's config to build with (defaults
#   to the project's first web app).
#
# Hosting target "main" (firebase.json) serves website/dist; the app is built by
# build:with-app and copied into dist/app. The snapshot.json is generated as part
# of build:public-demo.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# One Hosting release at a time, in order.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  # Save build minutes: only rebuild + publish when something this workflow ships changed
  # (site, app, shared data, Firestore rules/indexes, Cloud Functions, Firebase config, this
  # workflow). Firmware / Python / docs-only merges skip it. Manual runs always deploy.
  should-deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SITE: ${{ vars.PUBLIC_APP_ORIGIN || 'https://tendercells.com' }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # FIX(2026-09-30): compare with what is LIVE, not just the last commit. Each deploy
          # publishes the commit it shipped as /deploy-sha.txt, so a change is never lost when
          # its own CI / deploy run was cancelled by a newer push (e.g. a docs-only merge).
          LIVE=$(curl -fsS --max-time 10 "$SITE/deploy-sha.txt?t=$(date +%s)" | tr -dc '0-9a-f' | head -c 40 || true)
          if [ ${#LIVE} -ne 40 ] || ! git cat-file -e "$LIVE^{commit}" 2>/dev/null; then
            echo "Live commit unknown ('$LIVE') - deploying."; echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FILES=$(git diff --name-only "$LIVE" HEAD)
          echo "Changed since live $LIVE:"; echo "$FILES"
          if echo "$FILES" | grep -qE '^applications/tendercells_ui/test_output/(tendercells-ui|website|shared)/|^applications/tendercells_ui/test_output/express-api/(backend/src/mcp|mcp-view)/|^functions/|^firestore\.(rules|indexes\.json)$|^storage\.rules$|^firebase\.json$|^\.firebaserc$|^scripts/firebase-|^\.github/workflows/deploy\.yml$'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing this workflow deploys changed since the live commit - skipping the build."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: should-deploy
    if: needs.should-deploy.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/tendercells_ui/test_output
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run runs on the default branch; build the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install app deps
        run: npm ci --prefix tendercells-ui || npm install --prefix tendercells-ui

      - name: Install website deps
        run: npm ci --prefix website || npm install --prefix website

      - name: Install and build Cloud Functions
        working-directory: .
        run: |
          npm ci --prefix functions
          npm --prefix functions run build

      # FIX(2026-09-27): the app used to be built with NO Firebase config, so sign-in
      # and sign-up on tendercells.com/app always failed. Write the project's web
      # config to the repo-root .env (the app's envDir) before building.
      - name: Prepare Firebase credentials + web config
        working-directory: .
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TENDER_CELLS }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          TURN_URLS: ${{ secrets.TURN_URLS }}
          STRIPE_STARTER_PRICE_ID: ${{ vars.STRIPE_STARTER_PRICE_ID }}
          STRIPE_SCHOOL_PRICE_ID: ${{ vars.STRIPE_SCHOOL_PRICE_ID }}
          # Use Firebase's registered OAuth callback domain. The custom domain can
          # return only after its /__/auth/handler URI is added to the Google client.
          FIREBASE_AUTH_DOMAIN: tender-cells.firebaseapp.com
        run: |
          printf '%s' "$FIREBASE_SA" > "$HOME/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/sa.json" >> "$GITHUB_ENV"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
          PROJECT=$(node -e "console.log(require(process.env.HOME + '/sa.json').project_id)")
          echo "FIREBASE_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          npm i -g firebase-tools
          node scripts/firebase-web-env.mjs --project "$PROJECT"
          printf 'TURN_URLS=%s\nSTRIPE_STARTER_PRICE_ID=%s\nSTRIPE_SCHOOL_PRICE_ID=%s\n' "$TURN_URLS" "$STRIPE_STARTER_PRICE_ID" "$STRIPE_SCHOOL_PRICE_ID" > functions/.env

      - name: Check Firebase Auth settings (providers + authorized domains)
        working-directory: .
        continue-on-error: true
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          ACCESS_TOKEN=$(gcloud auth print-access-token) \
            node scripts/firebase-auth-check.mjs --project "$FIREBASE_PROJECT"

      - name: Build site + app + snapshot
        env:
          # Optional repo variables: OAuth client IDs shown to school IT admins on /schools
          # (public identifiers, not secrets) - see docs/SCHOOL_SSO_PLAN.md.
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          VITE_MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: npm --prefix website run build:with-app

      # Refuse to publish an app whose sign-in cannot work: the built /app bundle
      # must contain the project's apiKey and authDomain.
      - name: Verify website + app bundles have Firebase Auth config
        working-directory: .
        run: |
          APP_JS=applications/tendercells_ui/test_output/website/dist/app/assets
          echo "Root .env keys: $(cut -d= -f1 .env 2>/dev/null | tr '\n' ' ')"
          echo "Build env has API key: $([ -n "$VITE_FIREBASE_API_KEY" ] && echo yes || echo no)"
          test "$VITE_FIREBASE_AUTH_DOMAIN" = "tender-cells.firebaseapp.com" || {
            echo "::error::Production authDomain must use the registered Firebase callback domain."
            exit 1
          }
          SITE_JS=applications/tendercells_ui/test_output/website/dist/assets
          if grep -lqF "$VITE_FIREBASE_API_KEY" $SITE_JS/*.js; then
            echo "OK: website /account sign-in has the Firebase config."
          else
            echo "::error::Website bundle is missing the Firebase web config; /account sign-in would be broken. Not deploying."
            exit 1
          fi
          if grep -lq "authDomain:\"$VITE_FIREBASE_AUTH_DOMAIN\"" $APP_JS/*.js && grep -lqF "$VITE_FIREBASE_API_KEY" $APP_JS/*.js; then
            echo "OK: Firebase Auth config is embedded in the app bundle."
          else
            echo "::error::Built app bundle is missing the Firebase web config; sign-in would be broken. Not deploying."
            grep -o 'apiKey:"[^"]*",authDomain:"[^"]*"' $APP_JS/*.js | sed 's/apiKey:"[^"]*"/apiKey:"<redacted>"/' || true
            exit 1
          fi

      # Functions first: if they fail, Hosting (and its deploy-sha.txt marker) is not
      # updated, so the next run still sees these changes as undeployed and retries.
      - name: Deploy Cloud Functions
        working-directory: .
        run: firebase deploy --only functions --non-interactive --project "$FIREBASE_PROJECT"

      - name: Deploy Hosting and Firestore policy
        working-directory: .
        env:
          SHIPPED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Deploying to project: $FIREBASE_PROJECT"
          # The commit this release was built from - read by should-deploy next time.
          echo "$SHIPPED_SHA" > applications/tendercells_ui/test_output/website/dist/deploy-sha.txt
          firebase deploy --only hosting:main,firestore:rules,firestore:indexes --non-interactive --project "$FIREBASE_PROJECT"

      - name: Remove credentials
        if: always()
        working-directory: .
        run: rm -f "$HOME/sa.json" .env functions/.env
